! R1 : CE router, HBL Head Office
! Final configuration. Paste into global configuration mode.
!
hostname R1
no ip domain-lookup
!
interface Loopback0
 description Head Office loopback (OSPF router ID)
 ip address 11.1.1.1 255.255.255.255
!
interface FastEthernet0/0
 description Head Office LAN
 ip address 10.0.0.1 255.0.0.0
 no shutdown
!
interface Serial1/0
 description Link to R2 (PE, VRF A)
 ip address 1.1.1.1 255.0.0.0
 no shutdown
!
router ospf 10
 network 1.0.0.0 0.255.255.255 area 0
 network 11.0.0.0 0.255.255.255 area 0
 network 10.0.0.0 0.255.255.255 area 0
!
line con 0
 logging synchronous
!
end
