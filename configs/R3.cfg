! R3 : P router, provider core
! It has no VRF and no BGP. It never learns a customer route.
! Final configuration. Paste into global configuration mode.
!
hostname R3
no ip domain-lookup
ip cef
!
mpls label protocol ldp
mpls ldp router-id Loopback0
!
interface Loopback0
 description Core loopback (LDP ID)
 ip address 33.3.3.3 255.255.255.255
!
interface FastEthernet0/0
 description Provider LAN
 ip address 30.0.0.1 255.0.0.0
 no shutdown
!
interface Serial1/1
 description Link to R2 (PE)
 ip address 2.1.1.2 255.0.0.0
 mpls ip
 mpls label protocol ldp
 no shutdown
!
interface Serial1/0
 description Link to R4 (PE)
 ip address 3.1.1.1 255.0.0.0
 mpls ip
 mpls label protocol ldp
 no shutdown
!
router ospf 1
 network 2.0.0.0 0.255.255.255 area 0
 network 3.0.0.0 0.255.255.255 area 0
 network 33.3.3.3 0.0.0.0 area 0
 network 30.0.0.0 0.255.255.255 area 0
!
line con 0
 logging synchronous
!
end
