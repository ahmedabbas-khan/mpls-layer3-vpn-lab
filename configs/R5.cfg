! R5 : CE router, HBL Branch
! Final configuration. Paste into global configuration mode.
!
hostname R5
no ip domain-lookup
!
interface Loopback0
 description Branch loopback (OSPF router ID)
 ip address 55.5.5.5 255.255.255.255
!
interface FastEthernet0/0
 description Branch LAN
 ip address 50.0.0.1 255.0.0.0
 no shutdown
!
interface Serial1/1
 description Link to R4 (PE, VRF B)
 ip address 4.1.1.2 255.0.0.0
 no shutdown
!
router ospf 10
 network 4.0.0.0 0.255.255.255 area 0
 network 55.5.5.5 0.0.0.0 area 0
 network 50.0.0.0 0.255.255.255 area 0
!
line con 0
 logging synchronous
!
end
