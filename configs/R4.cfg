! R4 : PE router, owns VRF B (HBL Branch)
! Final configuration. Paste into global configuration mode.
!
hostname R4
no ip domain-lookup
ip cef
!
! Step 5.3 : VRF B
! "route-target 1:2" in the lab means both export and import, written out here.
ip vrf B
 rd 12:2
 route-target export 1:2
 route-target import 1:2
 ! Step 5.8 : also accept the Head Office route-target
 route-target import 1:1
!
! Step 5.2 : MPLS with LDP
mpls label protocol ldp
mpls ldp router-id Loopback0
!
interface Loopback0
 description Provider loopback (LDP ID, BGP peering address)
 ip address 44.4.4.4 255.255.255.255
!
interface FastEthernet0/0
 description Provider LAN
 ip address 40.0.0.1 255.0.0.0
 no shutdown
!
interface Serial1/0
 description Link to R3 (P router), MPLS core
 ip address 3.1.1.2 255.0.0.0
 mpls ip
 mpls label protocol ldp
 no shutdown
!
! Step 5.4 : customer facing port lives in VRF B
! The VRF command must come BEFORE the address, or the address is erased.
interface Serial1/1
 description Link to R5 (CE, HBL Branch)
 ip vrf forwarding B
 ip address 4.1.1.1 255.0.0.0
 no shutdown
!
! Step 5.1 : OSPF 1 for the provider core (customer network 4.0.0.0 is NOT here)
router ospf 1
 network 3.0.0.0 0.255.255.255 area 0
 network 44.4.4.4 0.0.0.0 area 0
 network 40.0.0.0 0.255.255.255 area 0
!
! Steps 5.5 and 5.9 : OSPF 10 inside VRF B, plus BGP routes back into OSPF
router ospf 10 vrf B
 redistribute bgp 10 subnets
 network 4.0.0.0 0.255.255.255 area 0
!
! Steps 5.6 and 5.7 : MP-BGP to R2
router bgp 10
 no synchronization
 neighbor 22.2.2.2 remote-as 10
 neighbor 22.2.2.2 update-source Loopback0
 no auto-summary
 !
 address-family vpnv4
  neighbor 22.2.2.2 activate
  neighbor 22.2.2.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf B
  redistribute ospf 10 match internal external 1 external 2
  no auto-summary
  no synchronization
 exit-address-family
!
line con 0
 logging synchronous
!
end
