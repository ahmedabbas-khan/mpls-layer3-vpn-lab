! R2 : PE router, owns VRF A (HBL Head Office)
! Final configuration. Paste into global configuration mode.
!
hostname R2
no ip domain-lookup
ip cef
!
! Step 5.3 : VRF A
! "route-target 1:1" in the lab means both export and import, written out here.
ip vrf A
 rd 12:1
 route-target export 1:1
 route-target import 1:1
 ! Step 5.8 : also accept the Branch route-target
 route-target import 1:2
!
! Step 5.2 : MPLS with LDP
mpls label protocol ldp
mpls ldp router-id Loopback0
!
interface Loopback0
 description Provider loopback (LDP ID, BGP peering address)
 ip address 22.2.2.2 255.255.255.255
!
interface FastEthernet0/0
 description Provider LAN
 ip address 20.0.0.1 255.0.0.0
 no shutdown
!
! Step 5.4 : customer facing port lives in VRF A
! The VRF command must come BEFORE the address, or the address is erased.
interface Serial1/0
 description Link to R1 (CE, HBL Head Office)
 ip vrf forwarding A
 ip address 1.1.1.2 255.0.0.0
 no shutdown
!
interface Serial1/1
 description Link to R3 (P router), MPLS core
 ip address 2.1.1.1 255.0.0.0
 mpls ip
 mpls label protocol ldp
 no shutdown
!
! Step 5.1 : OSPF 1 for the provider core (customer network 1.0.0.0 is NOT here)
router ospf 1
 network 2.0.0.0 0.255.255.255 area 0
 network 22.2.2.2 0.0.0.0 area 0
 network 20.0.0.0 0.255.255.255 area 0
!
! Steps 5.5 and 5.9 : OSPF 10 inside VRF A, plus BGP routes back into OSPF
router ospf 10 vrf A
 redistribute bgp 10 subnets
 network 1.0.0.0 0.255.255.255 area 0
!
! Steps 5.6 and 5.7 : MP-BGP to R4
router bgp 10
 no synchronization
 neighbor 44.4.4.4 remote-as 10
 neighbor 44.4.4.4 update-source Loopback0
 no auto-summary
 !
 address-family vpnv4
  neighbor 44.4.4.4 activate
  neighbor 44.4.4.4 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf A
  redistribute ospf 10 match internal external 1 external 2
  no auto-summary
  no synchronization
 exit-address-family
!
line con 0
 logging synchronous
!
end
